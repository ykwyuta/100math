<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="たし算・ひき算・かけ算を練習できる100マス計算。">
  <title>100マス計算</title>
  <link rel="icon" href="./icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="practice">
    <header class="masthead">
      <h1><span>100</span>マス計算</h1>
      <nav class="modes" aria-label="モード">
        <button id="home-mode" type="button" aria-pressed="true">ホーム</button>
        <button id="play-mode" type="button" aria-pressed="false">対戦</button>
        <button id="collection-mode" type="button" aria-pressed="false" disabled>コイン図鑑</button>
        <button id="practice-mode" type="button" aria-pressed="false">れんしゅう</button>
      </nav>
    </header>

    <section id="home-panel" class="start-screen" aria-labelledby="start-title">
      <div class="start-picture">
        <img src="./start.webp" alt="金色の数学者コインを囲むミジンコ、ネズミ、うさぎと女子学生">
      </div>
      <div class="start-content">
        <h2 id="start-title">計算バトルへ<br>ようこそ！</h2>
        <p>100マスを解いて連鎖で攻撃。勝つたびに数学者のコインが集まるよ。</p>
        <div class="start-actions">
          <button id="start-play" type="button" disabled>対戦をはじめる</button>
          <button id="start-practice" type="button" disabled>れんしゅう</button>
          <button id="start-collection" type="button" disabled>コイン図鑑</button>
        </div>
        <p id="start-status" role="status">読み込み中…</p>
      </div>
    </section>

    <section id="battle" hidden aria-label="計算対戦">
      <section class="opponents" aria-labelledby="roster-title">
        <h2 id="roster-title">対戦相手をえらぼう</h2>
        <div id="roster" class="roster" aria-labelledby="roster-title"></div>
      </section>
      <div class="arena">
        <section class="battle-round" aria-label="対戦盤">
          <div class="battle-controls">
            <label>計算の種類
              <select id="battle-operation" disabled>
                <option value="0">＋ たし算</option>
                <option value="1">− ひき算</option>
                <option value="2">× かけ算</option>
              </select>
            </label>
            <button id="battle-start" type="button" disabled>対戦開始</button>
          </div>
          <p id="battle-points" class="battle-points"></p>
          <div class="life">
            <div><label for="player-hp">あなた <span id="player-hp-text"></span></label><progress id="player-hp" max="36" value="36"></progress></div>
            <div><label for="opponent-hp"><span id="opponent-name">ミジンコ</span> <span id="opponent-hp-text"></span></label><progress id="opponent-hp" max="22" value="22"></progress></div>
          </div>
          <div class="duel">
            <div id="opponent-portrait" class="portrait" aria-hidden="true"></div>
            <div class="turn">
              <div class="round-stats"><span><strong id="combo">0</strong> 連鎖</span><span id="countdown"></span></div>
              <p id="question">読み込み中…</p>
              <form id="answer-form">
                <input id="battle-answer" aria-label="答え" maxlength="5" autocomplete="off" disabled>
                <button type="submit" disabled>攻撃</button>
              </form>
              <p id="battle-note" role="status"></p>
            </div>
          </div>
          <div class="board-legend">
            <span id="board-progress">0 / 100 マス</span>
            <span id="board-rules">隣のマスで連鎖、たて・よこ10マスでボーナス</span>
          </div>
          <table aria-describedby="board-rules" id="battle-grid" aria-label="対戦中の100マス計算表"></table>
        </section>
      </div>
    </section>

    <section id="collection-panel" class="collection" hidden aria-labelledby="collection-title">
      <div class="collection-header">
        <div>
          <h2 id="collection-title">数学者コイン図鑑</h2>
          <p id="collection-summary"></p>
        </div>
        <label>時代
          <select id="collection-era"></select>
        </label>
      </div>
      <p>対戦に1回勝つと10ポイント。コインが時代順に1枚ずつ増えます。</p>
      <ul id="coin-catalog"></ul>
    </section>

    <section id="practice-panel" hidden aria-label="れんしゅう">
    <p>左の数と上の数を使って、マスを埋めよう。</p>
    <div class="toolbar">
      <fieldset class="operations" disabled>
        <legend>計算の種類</legend>
        <label><input type="radio" name="operation" value="0" checked><span>＋ たし算</span></label>
        <label><input type="radio" name="operation" value="1"><span>− ひき算</span></label>
        <label><input type="radio" name="operation" value="2"><span>× かけ算</span></label>
      </fieldset>
      <div class="metrics">
        <div><span>入力済み</span><strong><span id="count">0</span><small> / 100</small></strong></div>
        <div><span>タイム</span><strong id="time">00:00</strong></div>
      </div>
    </div>

    <section class="worksheet" aria-label="計算問題">
      <div class="board">
        <table id="grid" aria-label="100マスの計算表" aria-describedby="instructions"></table>
      </div>
      <div class="actions">
        <button id="new" type="button" disabled>新しい問題</button>
        <button id="check" type="button" disabled>採点する</button>
      </div>
      <p id="result" role="status">読み込み中…</p>
    </section>
    <p id="instructions">Enter・Tabで次のマス、矢印キーで上下左右に移動。ひき算は「左 − 上」です。</p>
    </section>
    <noscript>100マス計算を使うにはJavaScriptを有効にしてください。</noscript>
  </main>
</body>
</html>
